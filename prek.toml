# Configuration for `prek` (https://prek.j178.dev), a fast pre-commit runner.
# Ported from .pre-commit-config.yaml. Install with: prek install -t pre-commit -t commit-msg
#:schema https://www.schemastore.org/prek.json

# Standard file hygiene hooks (prek's built-in reimplementations).
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-added-large-files" },
]

# Static analysis / SAST.
[[repos]]
repo = "https://github.com/semgrep/pre-commit"
rev = "v1.149.0"
hooks = [
    { id = "semgrep", args = ["--config", "auto", "--error", "--skip-unknown-extensions"] },
]

# Go vulnerability scan (uses the locally installed govulncheck).
[[repos]]
repo = "local"
hooks = [
    { id = "govulncheck", name = "govulncheck", entry = "govulncheck", args = ["./..."], language = "system", pass_filenames = false, types = ["go"] },
    # A package with no test file at all. First because it is the cheapest and
    # the one that was missing: mutation skips such a package rather than
    # failing on it, so the newest code was the code the gates said least about.
    { id = "tested-check", name = "every package has a test file", entry = "make tested-check", language = "system", pass_filenames = false, types = ["go"] },
    # Coverage floors, in total and per package.
    #
    # This comment used to claim the total caught a package nobody tested. It
    # does, eventually: measured, one added at 0% cost eight points before the
    # floor gave way, and until it did the average absorbed it. The per-package
    # floor is what makes the claim true now, and `tested-check` above catches
    # the worse case first.
    { id = "cover-check", name = "coverage floor", entry = "make cover-check", language = "system", pass_filenames = false, types = ["go"] },
    # The binary must not be made of the test harness. Cheap, and it is what
    # replaced `no-go-testing` for `cairn/test` — see the target's comment.
    { id = "harness-check", name = "the binary does not reach the harness", entry = "make harness-check", language = "system", pass_filenames = false, types = ["go"] },
    # Mutation: breaks each line on purpose and checks a test turns red.
    # Coverage only says a line ran. This is the slow hook — tens of seconds per
    # package — and it is here on purpose: a surviving mutant found at commit
    # time costs one test, found six months later it costs a rewrite.
    { id = "mutation", name = "mutation (gremlins)", entry = "make mutation", language = "system", pass_filenames = false, types = ["go"] },
]

# Go formatting, imports, and lint/test.
[[repos]]
repo = "https://github.com/dnephin/pre-commit-golang"
rev = "v0.5.1"
hooks = [
    { id = "go-fmt" },
    { id = "go-imports" },
    # `cairn/test` imports testing outside a _test.go file, deliberately and
    # with nowhere else to go. `make harness-check` is what guards it instead.
    { id = "no-go-testing", exclude = "^test/" },
    { id = "golangci-lint" },
    # The script runs `go test ./...` and never looks at the files it is
    # handed, so letting prek hand it any at all makes it run the whole suite
    # once per batch — ten times over, in parallel, for one answer. Measured:
    # that contention is what made `internal/cli` take 27 seconds instead of
    # 7, and what let a five-millisecond deadline in the board's harness drop
    # a real answer, one run in ten.
    { id = "go-unit-tests", pass_filenames = false },
]

# Conventional-commit message linting (runs on commit-msg).
[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.22.0"
hooks = [
    { id = "commitlint", stages = ["commit-msg"], additional_dependencies = ["@commitlint/config-conventional"] },
]
