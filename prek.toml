# Configuration for `prek` (https://prek.j178.dev), a fast pre-commit runner.
# Install with:
#   prek install -t pre-commit -t commit-msg -t pre-push
#:schema https://www.schemastore.org/prek.json

# A hook runs at commit unless it says otherwise. Without this every hook would
# run again at push, which is the whole commit gate a second time for nothing.
default_stages = ["pre-commit"]

# The first hook to fail stops the run, and the hooks are written cheapest
# first: a missing import or a formatting slip is reported in a second, rather
# than after semgrep, the suite and the mutation gate have run for nothing.
fail_fast = true

# Every repository below is named by the commit it was at, never by a tag: a
# tag can be moved, and a hook whose own behaviour changed under a commit
# nobody made fails — or passes — for a reason that is not in this repository.
# What the tools find stays current; what the tools are does not move on its
# own (docs/checks.md). The tag stays in the comment beside each, for whoever
# updates it (`prek update --freeze`).

# Standard file hygiene hooks (prek's built-in reimplementations).
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-added-large-files" },
]


# The linter and the scanner are the versions the Makefile names, asked before
# either runs: it says nothing about the code, only about the tools about to
# judge it, and a rule that appeared overnight would otherwise read as a fault.
[[repos]]
repo = "local"
hooks = [
    { id = "tools-present", name = "the checks are the versions named", entry = "make tools-present", language = "system", pass_filenames = false, files = '(\.go|(^|/)go\.(mod|sum)|(^|/)\.golangci\.yml|(^|/)Makefile)$' },
]

# Go formatting, imports, and lint.
[[repos]]
repo = "https://github.com/dnephin/pre-commit-golang"
rev = "fb24a639f7c938759fe56eeebbb7713b69d60494" # frozen: v0.5.1
hooks = [
    { id = "go-fmt" },
    { id = "go-imports" },
    # `cairn/test` imports testing outside a _test.go file, deliberately and
    # with nowhere else to go. `make harness-check` is what guards it instead.
    { id = "no-go-testing", exclude = "^test/" },
    # Its configuration decides what it refuses, so changing it is judged too.
    { id = "golangci-lint", types = ["text"], files = '(\.go|(^|/)\.golangci\.yml)$' },
    # No go-unit-tests here: cover-check builds its profile from `go test -race
    # ./...`, which fails when a test does, so the suite ran twice for one
    # answer. The profile is rebuilt whenever a Go file, a scenario or a pinned
    # frame changes. See docs/checks.md.
]

# Shell scripts: the release, the checks, and the hook Claude Code runs on
# every message — where a quoting slip is a fault on somebody else's machine.
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "745eface02aef23e168a8afb6b5737818efbea95" # frozen: v0.11.0.1
hooks = [
    { id = "shellcheck" },
]

# Static analysis / SAST, and secrets written into a file by mistake.
#
# The rules are the registry's Go and secrets packs, named rather than left to
# `--config auto`, which reported home to choose them — and with metrics off,
# which auto would not allow. They are fetched as they stand on the day: a
# rule that is new today found something already true yesterday, which is the
# right way round (docs/checks.md). The tool running them is pinned below.
[[repos]]
repo = "https://github.com/semgrep/pre-commit"
rev = "77992ab659fa5edee088eaf8472eaf178ed8a995" # frozen: v1.149.0
hooks = [
    { id = "semgrep", args = ["--config", "p/golang", "--config", "p/secrets", "--metrics=off", "--error", "--skip-unknown-extensions"] },
]

# The checks this repository runs itself, cheapest first: a package with no
# test, the binary reaching the harness, the vulnerability scan, the suite and
# its coverage, then mutation.
#
# Each of these says which files it is about with `files` rather than
# `types = ["go"]`. Filtered on Go alone, a commit that changed only a
# scenario, a pinned frame or go.mod ran no suite and no scan at all — yet a
# scenario is executed by the suite and go.mod is what govulncheck reads.
[[repos]]
repo = "local"
hooks = [
    # A package with no test file at all. First because it is the cheapest and
    # the one that was missing: mutation skips such a package rather than
    # failing on it, so the newest code was the code the gates said least about.
    { id = "tested-check", name = "every package has a test file", entry = "make tested-check", language = "system", pass_filenames = false, files = '\.go$' },
    # The binary must not be made of the test harness. Cheap, and it is what
    # replaced `no-go-testing` for `cairn/test` — see the target's comment.
    { id = "harness-check", name = "the binary does not reach the harness", entry = "make harness-check", language = "system", pass_filenames = false, files = '(\.go|(^|/)go\.(mod|sum))$' },
    # Windows builds what was written, tests included: a few seconds, so with
    # the cheap checks. See the target's comment.
    { id = "windows-check", name = "it builds for Windows", entry = "make windows-check", language = "system", pass_filenames = false, files = '(\.go|(^|/)go\.(mod|sum))$' },
    # The vulnerability scan reads the whole module graph: after the cheap
    # checks, before the suite.
    { id = "govulncheck", name = "govulncheck", entry = "govulncheck", args = ["./..."], language = "system", pass_filenames = false, files = '(\.go|(^|/)go\.(mod|sum))$' },
    # Coverage floors, in total and per package.
    #
    # This comment used to claim the total caught a package nobody tested. It
    # does, eventually: measured, one added at 0% cost eight points before the
    # floor gave way, and until it did the average absorbed it. The per-package
    # floor is what makes the claim true now, and `tested-check` above catches
    # the worse case first.
    { id = "cover-check", name = "coverage floor", entry = "make cover-check", language = "system", pass_filenames = false, files = '(\.go|\.feature|\.sh|(^|/)go\.(mod|sum)|/testdata/.+|^plugin/.+|^\.claude-plugin/.+)$' },
    # Mutation: breaks each line on purpose and checks a test turns red.
    # Coverage only says a line ran. Mutation is the slow gate, and it is split
    # in two on purpose: at commit, the lines that changed, in the packages they
    # are in — a surviving mutant found then costs one test; at push, every
    # package, so nothing leaves the machine without the whole of it judged.
    # A test weakened without touching the code it guarded is what only the
    # second one sees. See docs/checks.md.
    { id = "mutation", name = "mutation, what changed (gremlins)", entry = "make mutation-changed", language = "system", pass_filenames = false, files = '(\.go|(^|/)\.gremlins\.yaml)$' },
    { id = "mutation-all", name = "mutation, every package (gremlins)", entry = "make mutation", language = "system", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]


# Conventional-commit message linting (runs on commit-msg).
[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "879f5400493f84c8b683bdeb3366a8439ca17858" # frozen: v9.22.0
hooks = [
    { id = "commitlint", stages = ["commit-msg"], additional_dependencies = ["@commitlint/config-conventional@21.2.0"] },
]
