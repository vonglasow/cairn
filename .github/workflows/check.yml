# The checks a commit runs, run again on every pull request — see
# .claude/docs/checks.md. A change Dependabot proposes was made on no machine, so no
# hook judged it; this is what does. Every hook prek has at commit, on every
# file. On Linux, so the half of what cairn says it runs on that is not where
# it is written is judged each time. And mutation, which no hook runs: it froze
# the machine it ran on, so it runs here — on the lines a push changes in the
# packages holding the rules, and over the whole of them every night.
name: check

on:
  pull_request:
  push:
    branches: [main]
  # The whole sweep, which no push waits on: the engine alone is over two
  # hours of mutants — see .claude/docs/checks.md.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  # release.yml calls it on the commit a tag names, and releases nothing unless
  # every job here passed on that commit — see .claude/docs/release.md.
  workflow_call:

permissions:
  contents: read

# A push that follows another takes its place: the sweep of a commit already
# replaced says nothing anybody will act on. The night's sweep is in a group of
# its own, so a push to main does not cancel it.
concurrency:
  group: check-${{ github.ref }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  prek:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      # Drawing off screen needs a GPU the runner does not have; the tests that
      # draw say so and are skipped, as in scripts/linux.sh.
      CAIRN_WINDOWLESS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: the graphics headers the window is built against, and jq
        run: scripts/linux-headers.sh jq
      # The prek this action was released with, checked against the sum it
      # carries: it moves when Dependabot moves the action.
      # Every hook but the coverage floor, which the jobs below hold: run
      # here, it ran the whole suite end to end, the window's half of it alone
      # longer than everything else — see cairn#266.
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: cover-check
        with:
          prek-version: latest-known
          extra-args: --all-files

  # The suite's coverage in four parts side by side — the window, the command
  # line, the terminal, the rest — each crediting every package it reaches,
  # so the profile is the one a single run writes, made in the time of its
  # longest part.
  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [gui, cli, tui, rest]
    env:
      CAIRN_WINDOWLESS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: the graphics headers the window is built against, and jq
        run: scripts/linux-headers.sh jq
      - name: the suite's ${{ matrix.part }} part, with its profile
        run: make coverage-part PART=${{ matrix.part }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ matrix.part }}
          path: coverage-${{ matrix.part }}.out
          if-no-files-found: error

  # The floors, on the four parts made one profile: the hook prek skipped
  # above, judging what the commit's hooks judge.
  coverage-floor:
    needs: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: the floors, in total and per package
        run: make coverage-merge && make -o coverage.out cover-check

  # The suite with the race detector, which the commit's hooks no longer run:
  # with it the suite took more than ten minutes on a Mac — see cairn#266.
  race:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      CAIRN_WINDOWLESS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: the graphics headers the window is built against, and jq
        run: scripts/linux-headers.sh jq
      - name: the suite, with the race detector
        run: make race

  # The lines a push or a pull request changes, in the packages holding the
  # rules: what it is judged on, in minutes. A test weakened elsewhere changes
  # no line of them; the night's sweep is what sees it. A tag, which a release
  # runs this on, is judged by neither: its commit was judged when pushed.
  mutation-changed:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CAIRN_WINDOWLESS: "1"
      MUTATION_WORKERS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: the graphics headers the window is built against, and jq
        run: scripts/linux-headers.sh jq
      # What the branch held before: the base of a pull request, or the commit
      # a push came after. A branch pushed for the first time, or a commit the
      # history no longer holds, falls back to the commit's parent.
      - id: since
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "commit=$(git merge-base "$BEFORE" HEAD)" >>"$GITHUB_OUTPUT"
          else
            echo "commit=$(git rev-parse HEAD^)" >>"$GITHUB_OUTPUT"
          fi
      - name: mutation, the lines changed since ${{ steps.since.outputs.commit }} (gremlins)
        env:
          MUTATION_SINCE: ${{ steps.since.outputs.commit }}
        run: make mutation-changed PKG="$(scripts/mutation.sh --core | tr '\n' ' ')"

  # The packages holding the rules, as scripts/mutation.sh lists them: one job
  # each, side by side, so the sweep lasts as long as its longest package. Every
  # night, or by hand.
  gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: list
        run: echo "packages=$(scripts/mutation.sh --list)" >>"$GITHUB_OUTPUT"

  mutation:
    needs: gate
    runs-on: ubuntu-24.04
    # Each mutant a build and a run of its package's tests: bounded so a hang
    # cannot hold a runner, and a package past it is one to split — `split` in
    # scripts/mutation.sh, which lists it shard by shard.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.gate.outputs.packages) }}
    env:
      CAIRN_WINDOWLESS: "1"
      MUTATION_WORKERS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: the graphics headers the window is built against, and jq
        run: scripts/linux-headers.sh jq
      - name: mutation, ${{ matrix.package }} (gremlins)
        run: make mutation PKG=${{ matrix.package }}
      - id: name
        if: always()
        run: echo "report=mutation-report-$(echo '${{ matrix.package }}' | tr -c 'a-z0-9\n' -)" >>"$GITHUB_OUTPUT"
      - name: what the sweep found
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.name.outputs.report }}
          path: mutation-report/
