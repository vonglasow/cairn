# The release of a version, run when its tag is pushed — see docs/release.md.
# The tag is made by hand with make release, once every check has passed; this
# runs every check of check.yml again on the tagged commit, then builds what is
# handed over and hands it over. The window needs cgo, so each
# binary is built on the system it runs on, one job each.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  # Run by hand, it builds the binaries and stops there: a way to see every
  # system build before a version is tagged.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every check of check.yml, on the commit the tag names: a version whose
  # checks did not pass is never built, whatever was run by hand before the
  # tag was pushed. Run by hand, the binaries are only a preview, and the
  # checks are left to check.yml's own run.
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/check.yml

  binaries:
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: the graphics headers the window is built against
        if: runner.os == 'Linux'
        run: scripts/linux-headers.sh
      - name: make, which the Windows image does not carry
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: make package VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binary-${{ matrix.runs-on }}
          path: dist/cairn-*-*-*.*
          if-no-files-found: error

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: the tag itself, whose message is the version's notes
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: every archive's sum, the changelog, and the formula fetching from this release
        run: |
          for archive in dist/cairn-v*-*-*.*; do scripts/sums.sh dist "$(basename "$archive")"; done
          scripts/changelog.sh "$TAG" >dist/CHANGELOG.md
          scripts/formula.sh "$TAG" dist "https://github.com/${{ github.repository }}/releases/download/$TAG"
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$TAG" >notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            dist/cairn-"$TAG"-* dist/SHA256SUMS dist/CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formula
          path: dist/Formula
          if-no-files-found: error

  # The documentation site, built from the tagged commit once the version is
  # released, so the site out always describes the version out. On macOS,
  # where the window is drawn off screen for its pictures. GitHub Pages takes
  # it from the artifact; its source is set to "GitHub Actions" once, by hand.
  site:
    needs: release
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: the tag itself, which the changelog is read up to
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: make site VERSION="$TAG" NEXT="$TAG"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist/site

  pages:
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  tap:
    needs: release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vonglasow/homebrew-tap
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: formula
          path: Formula
      - name: the formula, pushed to the tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cairn.rb Formula/cairn@*.rb
          git commit -m "Brew formula update for cairn version $TAG"
          git push
