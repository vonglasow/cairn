version: "2"

# cairn — lint configuration.
#
# prek runs this at every commit, so anything enabled here blocks one.
#
# The bias: this repo's comments are its documentation. The module is named
# `cairn` with no domain path, so pkg.go.dev can never host it, and everything
# lives under internal/, so no one imports it either. That leaves the comments
# in the source as the only documentation of intent — which is why the rules
# below are about comments existing and reading like sentences, not about
# stylistic noise.

linters:
  default: standard
  enable:
    # Exported symbols carry a comment, and it starts with the symbol's name.
    - revive
    # Comments end with a period, so a truncated sentence is visible.
    - godot
    # Wraps sentinel errors properly: `errors.Is` rather than `==`, and `%w`
    # rather than `%v`. Enabled from the start because it is cheap now and
    # expensive later — a codebase that has already compared errors with == in
    # forty places does not turn this on.
    - errorlint
    # Enforces the layering described in docs/architecture.md. Without it the
    # layering is a wish: a command could reach the database directly and
    # nothing would notice until the second surface needed the same rule.
    - depguard

  settings:
    depguard:
      rules:
        # The entities know nobody. This one is an allow-list, not a deny-list,
        # because a deny-list only forbids what someone thought to name — and
        # `database/sql` finding its way into an entity is precisely the import
        # nobody would have thought to name. Everything absent here is refused,
        # so widening this list is a decision somebody makes on purpose.
        domain:
          files: ["**/internal/domain/**"]
          allow:
            - errors
            - fmt
            - slices
            - strings
            - time
            # What makes a rune a control character, and what makes it a line
            # separator, are facts about text — the same kind of fact `strings`
            # already carries here. Widened on purpose so a title can refuse to
            # be more than one line.
            - unicode
            # Only reachable from _test.go: the `no-go-testing` hook refuses
            # `testing` anywhere else, so allowing it here cannot leak into
            # production code.
            - testing

        # Which build this is knows nobody, for the same reason an entity does:
        # both surfaces have to answer the question, and an identity owned by one
        # of them is an identity the other borrows. An allow-list, like domain.
        build:
          files: ["**/internal/build/**"]
          allow:
            - fmt
            - runtime
            - runtime/debug
            - strings
            - text/tabwriter
            # Only reachable from _test.go: the harness guard refuses testing in
            # anything the binary is made of.
            - testing
            # The same, and widened on purpose for one thing: walking Info's
            # fields, so that a field added and not printed turns a test red.
            # Listing the fields by hand would prove the ones that exist and
            # nothing about the next one, which is the one that would go out in
            # a release saying nothing.
            - reflect

        # The task holds the task: what it carries, and the rules that keep it
        # valid. It reaches domain, for the attributes a task carries and the
        # title rule it shares with an objective, and nothing else — a task
        # that knew how it is stored or displayed would drag a database or a
        # terminal into every test that touches it, the same reason domain
        # itself knows nobody. A deny-list, like store and engine, because what
        # it must never reach is a short, named list rather than everything
        # unnamed.
        task:
          files: ["**/internal/task/**"]
          deny:
            - pkg: cairn/internal/store
              desc: a task knows nothing of how it is stored
            - pkg: cairn/internal/engine
              desc: a task knows nothing of the operations run on it
            - pkg: cairn/internal/cli
              desc: a task knows nothing of how it is displayed
            - pkg: cairn/internal/mcp
              desc: a task knows nothing of how it is displayed
            - pkg: database/sql
              desc: a task that knew how it is stored would drag a database into every test that touches it
            - pkg: github.com/spf13/cobra
              desc: a task is not a surface
            - pkg: github.com/charmbracelet/fang
              desc: a task is not a surface

        # The objective holds the objective: what it carries, and the rules
        # that keep it valid. It reaches domain, for the attributes an
        # objective carries and the title rule it shares with a task, and
        # nothing else — not even cairn/internal/task: an objective that knew
        # of the task would close the circle task's own rule keeps open, and
        # what it needs from a task (TasksServing) is store's and engine's to
        # ask for, not its own. A deny-list, like task, because what it must
        # never reach is a short, named list rather than everything unnamed.
        objective:
          files: ["**/internal/objective/**"]
          deny:
            - pkg: cairn/internal/task
              desc: an objective knows nothing of a task; store and engine are what ties the two together
            - pkg: cairn/internal/store
              desc: an objective knows nothing of how it is stored
            - pkg: cairn/internal/engine
              desc: an objective knows nothing of the operations run on it
            - pkg: cairn/internal/cli
              desc: an objective knows nothing of how it is displayed
            - pkg: cairn/internal/mcp
              desc: an objective knows nothing of how it is displayed
            - pkg: database/sql
              desc: an objective that knew how it is stored would drag a database into every test that touches it
            - pkg: github.com/spf13/cobra
              desc: an objective is not a surface
            - pkg: github.com/charmbracelet/fang
              desc: an objective is not a surface

        # The migration holds the change: what it does to the shape of the
        # store, what undoes it, and what undoing it costs. It reaches domain,
        # for what a store holds and for writing a moment the way a person
        # reads one, and nothing else — a change that knew how it is stored
        # or displayed would drag a database or a terminal into every test
        # that touches it, the same reason task and objective know neither.
        # A deny-list, like task and objective, because what it must never
        # reach is a short, named list rather than everything unnamed.
        migration:
          files: ["**/internal/migration/**"]
          deny:
            - pkg: cairn/internal/store
              desc: a change knows nothing of how it is stored; the store executes its SQL, it does not own the change
            - pkg: cairn/internal/engine
              desc: a change knows nothing of the operations run on it
            - pkg: cairn/internal/cli
              desc: a change knows nothing of how it is displayed
            - pkg: cairn/internal/mcp
              desc: a change knows nothing of how it is displayed
            - pkg: database/sql
              desc: a change that knew how it is stored would drag a database into every test that touches it
            - pkg: github.com/spf13/cobra
              desc: a change is not a surface
            - pkg: github.com/charmbracelet/fang
              desc: a change is not a surface

        # The act holds one thing that was done to a task: what it was, what it
        # became, when, and through which surface. It reaches domain, for writing
        # a moment the way a person reads one, and nothing else — not even
        # cairn/internal/task, which is the one worth spelling out. An act names
        # its task by number and never carries the task: a task may be gone by
        # the time its acts are read, and an act holding one could not outlive
        # it. Reaching for the task would undo that.
        trace:
          files: ["**/internal/trace/**"]
          deny:
            - pkg: cairn/internal/task
              desc: an act names its task by number, never carries it, so it outlives the task it describes
            - pkg: cairn/internal/objective
              desc: an act is about a task; an objective has nothing to do with one
            - pkg: cairn/internal/store
              desc: an act knows nothing of how it is kept; the store writes it down, it does not own it
            - pkg: cairn/internal/engine
              desc: an act knows nothing of the operations that produced it
            - pkg: cairn/internal/cli
              desc: an act knows nothing of how it is displayed
            - pkg: cairn/internal/mcp
              desc: an act knows nothing of how it is displayed
            - pkg: database/sql
              desc: an act that knew how it is kept would drag a database into every test that touches it
            - pkg: github.com/spf13/cobra
              desc: an act is not a surface
            - pkg: github.com/charmbracelet/fang
              desc: an act is not a surface

        # The store is called by the engine and speaks in entities. It is the
        # only package that knows a database exists.
        store:
          files: ["**/internal/store/**"]
          deny:
            - pkg: cairn/internal/engine
              desc: the store is called by the engine, it never calls it
            - pkg: cairn/internal/cli
              desc: the store must not know how anything is displayed
            - pkg: cairn/internal/mcp
              desc: the store must not know how anything is displayed
            - pkg: github.com/spf13/cobra
              desc: the store is not a surface
            - pkg: github.com/charmbracelet/fang
              desc: the store is not a surface

        # The engine is called by surfaces; it never calls them, and it never
        # opens a database itself — that is the whole reason the store exists.
        engine:
          files: ["**/internal/engine/**"]
          deny:
            - pkg: cairn/internal/cli
              desc: the engine is called by surfaces, it never calls them
            - pkg: cairn/internal/mcp
              desc: the engine is called by surfaces, it never calls them
            - pkg: database/sql
              desc: the engine asks the store, it does not reach a database
            - pkg: github.com/spf13/cobra
              desc: the engine is not a surface

        # The harness is handed a way to run a command and never learns who
        # answers. Importing a surface would close a cycle, since that surface's
        # own scenarios import the harness — and it would also let a step assert
        # against the layer below the one it observes.
        test:
          files: ["**/test/**"]
          deny:
            - pkg: cairn/internal/cli
              desc: the harness is handed a runner, it never reaches a surface
            - pkg: cairn/internal/mcp
              desc: the harness is handed a runner, it never reaches a surface
            - pkg: cairn/internal/store
              desc: a scenario asks the engine, never the store
            - pkg: database/sql
              desc: a scenario never opens a database

        # A surface asks the engine. Reaching the store directly would put a
        # rule the engine owns into a second place, where it drifts.
        cli:
          files: ["**/internal/cli/**"]
          deny:
            - pkg: cairn/internal/store
              desc: a surface changes state through the engine, never behind it
            - pkg: database/sql
              desc: a surface never opens a database

        # The third surface. Same rule as the other two — it asks the engine and
        # never the store — plus the one mcp has: the command line builds the
        # board, so the board never reads the command line back.
        board:
          files: ["**/internal/board/**"]
          deny:
            - pkg: cairn/internal/cli
              desc: the command line opens the board, the board never reads it
            - pkg: cairn/internal/store
              desc: a surface changes state through the engine, never behind it
            - pkg: cairn/internal/mcp
              desc: two surfaces do not reach each other
            - pkg: database/sql
              desc: a surface never opens a database
            - pkg: github.com/spf13/cobra
              desc: the board is opened by a command, it does not parse one

        # The other surface, held to the same rules, plus one of its own: it may
        # not read the command line. `cli` builds the server, so the arrow runs
        # that way and only that way — a server reaching back would be reading
        # another surface's private state to work out what it is.
        #
        # Its scenarios are carved out because they are in `package mcp_test` and
        # do drive the command line: an agent's claim that "what was done at the
        # terminal is there on the next call" can only be checked by a step that
        # reaches the terminal.
        mcp:
          files: ["**/internal/mcp/**", "!**/internal/mcp/*_test.go"]
          deny:
            - pkg: cairn/internal/cli
              desc: the command line builds the server, the server never reads it
            - pkg: cairn/internal/store
              desc: a surface changes state through the engine, never behind it
            - pkg: database/sql
              desc: a surface never opens a database

    revive:
      rules:
        - name: exported
        - name: package-comments
    godot:
      # Only declaration comments, not every inline `// like this one`.
      scope: declarations

  exclusions:
    rules:
      # Tests document themselves by their names and their failure messages;
      # requiring a doc comment on every helper there is noise.
      - path: _test\.go
        linters:
          - revive
          - godot

formatters:
  enable:
    - gofmt
    - goimports
