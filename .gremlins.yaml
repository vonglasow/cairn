# gremlins — mutation testing configuration.
#
# Coverage says a line ran; mutation says a test would have noticed if it were
# wrong. Run it with `make mutation`.
#
# The threshold is not here. It lives in the Makefile, next to the loop that
# applies it package by package, because docs/checks.md puts a check's logic in
# one place and one place only. A copy of it in this file would be a second
# truth that nothing keeps in step.

unleash:
  # Without this, gremlins derives its per-mutant timeout from the baseline test
  # run — and the budget has to cover recompiling the package inside a copy of
  # the module, not just running the tests. Too tight and mutants come back
  # TIMED OUT, which counts as neither killed nor survived: the run then reports
  # 100% efficacy having judged almost nothing.
  #
  # Measured on internal/cli, 30 mutants: coefficient 10 judged 5 and timed out
  # 25 while still printing 100%; coefficient 30 judged all 30. Raised to 30,
  # with room to spare. The mcover threshold in the Makefile is what makes a
  # future timeout fail loudly instead of passing quietly.
  timeout-coefficient: 30

  # Mutators. The defaults are kept; the ones off by default stay off because
  # they produce a lot of equivalent mutants (a mutant that cannot change
  # observable behaviour, so no test can ever kill it) and would drag the score
  # down without pointing at a single weak test.
  arithmetic-base: true
  conditionals-boundary: true
  conditionals-negation: true
  increment-decrement: true
  invert-negatives: true
  invert-assignments: false
  invert-bitwise: false
  invert-bwassign: false
  invert-logical: false
  invert-loopctrl: false
  remove-self-assignments: false
