# Solarized, light: the monotones swapped, as its author's page says.
system: "base16"
name: "Solarized Light"
author: "Ethan Schoonover (https://ethanschoonover.com/solarized/)"
variant: "light"
palette:
  base00: "#fdf6e3"
  base01: "#eee8d5"
  base02: "#93a1a1"
  base03: "#839496"
  base04: "#657b83"
  base05: "#586e75"
  base06: "#073642"
  base07: "#002b36"
  base08: "#dc322f"
  base09: "#cb4b16"
  base0A: "#b58900"
  base0B: "#859900"
  base0C: "#2aa198"
  base0D: "#268bd2"
  base0E: "#6c71c4"
  base0F: "#d33682"
# What cairn wears beside the palette. Each token below is moved from what
# the palette gives, the least it takes, until the scheme meets every
# check cairn holds a scheme to (.claude/docs/gui.md, a theme sets tokens).
cairn:
  tokens:
    accent.base: "#1e76b2"
    ink.faint: "#516163"
    ink.low: "#7b8887"
    ink.on_tint: "#3c6a82"
    ink.text: "#4a6067"
    line.edge: "#8b8f8a"
    line.raised: "#c4c4b8"
    line.rule: "#dbd8c9"
    priority.normal: "#33a089"
    state.late: "#a03f16"
    surface.ground: "#f1ecdb"
    surface.raised: "#dad8c9"
  labels:
    yellow: "#a77d00"
    green: "#788a00"
    teal: "#248f86"
    sky: "#258daa"
    sapphire: "#2488b8"
    blue: "#2588ce"
